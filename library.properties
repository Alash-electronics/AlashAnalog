sentence=Easy analog sensor library: soil moisture, light, water level, gas and battery voltage in percent or words with calibration, median filter and hysteresis.
paragraph=Turns raw analogRead() numbers into something useful: percent from a two-point calibration (or autoRange), median filtering against spikes, voltage through a divider, thresholds with hysteresis for pumps and lamps, and plain words such as dry, dark, gas in Russian, Kazakh or English. diagnose() tells if the sensor has no power, a broken wire or a floating pin. Works on Arduino AVR, ESP32, ESP8266. Examples included, made for classes and kits by Alash Electronics.
